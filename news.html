<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate Registration</title>
<script>
  function submitForm(event) {
    event.preventDefault();

    const formData = {
      name: document.getElementById("name").value,
      dob: document.getElementById("dob").value,
      gender: document.querySelector('input[name="gender"]:checked')?.value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      permanent: document.getElementById("permanent").value,
      current: document.getElementById("current").value,
      qualification: document.getElementById("qualification").value,
      stream: document.getElementById("stream").value,
      college: document.getElementById("college").value,
      year: document.getElementById("year").value,
      occupation: document.getElementById("occupation").value,
      organization: document.getElementById("organization").value,
      experience: document.getElementById("experience").value,
    };

    fetch("YOUR_WEB_APP_URL_HERE", {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(formData)
    });

    alert("Form submitted successfully!");
    document.getElementById("regForm").reset();
  }
</script>
</head>

<body>
<h2>Candidate Registration Form</h2>

<form id="regForm" onsubmit="submitForm(event)">
  <label>Full Name</label>
  <input type="text" id="name" required>

  <label>Date of Birth</label>
  <input type="date" id="dob" required>

  <label>Gender</label>
  <input type="radio" name="gender" value="Male"> Male
  <input type="radio" name="gender" value="Female"> Female
  <input type="radio" name="gender" value="Other"> Other
  
  <label>Email</label>
  <input type="email" id="email" required>

  <label>Phone</label>
  <input type="tel" id="phone" required>

  <label>Permanent Address</label>
  <textarea id="permanent" required></textarea>

  <label>Current Address</label>
  <textarea id="current"></textarea>

  <label>Highest Qualification</label>
  <select id="qualification">
    <option>High School</option>
    <option>Diploma</option>
    <option>Bachelor's</option>
    <option>Master's</option>
    <option>PhD</option>
  </select>

  <label>Stream / Specialization</label>
  <input type="text" id="stream">

  <label>College / University</label>
  <input type="text" id="college">

  <label>Year of Passing</label>
  <input type="number" id="year">

  <label>Occupation</label>
  <input type="text" id="occupation">

  <label>Organization</label>
  <input type="text" id="organization">

  <label>Experience (Years)</label>
  <input type="number" id="experience">

  <button type="submit">Submit</button>
</form>

</body>
</html>
