<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimal Registration</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 320px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background: #005ec2;
  }
</style>

<script>
  function verifyForm(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const passport = document.getElementById("passport").value;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passportPattern = /^[A-Za-z0-9]{6,15}$/; 

    if (!emailPattern.test(email)) {
      alert("Invalid email format!");
      return;
    }

    if (!passportPattern.test(passport)) {
      alert("Invalid passport number! Use 6–15 letters/numbers.");
      return;
    }

    alert("Registration successful!");
  }
</script>

</head>
<body>

<div class="box">
  <h3 style="text-align:center;">Register</h3>

  <form onsubmit="verifyForm(event)">
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="passport" placeholder="Passport Number" required>

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
