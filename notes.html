<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes – PDF Tabs</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, sans-serif;
    }

    .tabs-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-buttons button {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.25s;
      white-space: nowrap;
    }

    .tab-buttons button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .tab-buttons button:hover {
      opacity: 0.9;
    }

    .pdf-frame {
      width: 100%;
      height: 85vh;
      border: none;
      display: none;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .pdf-frame.active {
      display: block;
    }
  </style>

  <script>
    function switchPDF(tabIndex) {
      const frames = document.querySelectorAll(".pdf-frame");
      const buttons = document.querySelectorAll(".tab-buttons button");

      frames.forEach(f => f.classList.remove("active"));
      buttons.forEach(b => b.classList.remove("active"));

      frames[tabIndex].classList.add("active");
      buttons[tabIndex].classList.add("active");
    }

    window.onload = () => switchPDF(0); // Default: show first PDF
  </script>

</head>
<body>

  <div class="tabs-container">

    <h1 class="text-xl font-bold mb-4">Research Notes (PDF Viewer)</h1>

    <!-- TAB BUTTONS -->
    <div class="tab-buttons">
      <button onclick="switchPDF(0)">EOS Notes</button>
      <button onclick="switchPDF(1)">NS Oscillations</button>
      <button onclick="switchPDF(2)">PTA Models</button>
      <button onclick="switchPDF(3)">BSM Calculations</button>
    </div>

    <!-- TAB 1 -->
    <iframe
      class="pdf-frame"
      src="../assets/notes/eos.pdf#toolbar=1&navpanes=0">
    </iframe>

    <!-- TAB 2 -->
    <iframe
      class="pdf-frame"
      src="../assets/notes/oscillations.pdf#toolbar=1&navpanes=0">
    </iframe>

    <!-- TAB 3 -->
    <iframe
      class="pdf-frame"
      src="../assets/notes/pta.pdf#toolbar=1&navpanes=0">
    </iframe>

    <!-- TAB 4 -->
    <iframe
      class="pdf-frame"
      src="../assets/notes/bsm.pdf#toolbar=1&navpanes=0">
    </iframe>

  </div>

</body>
</html>
